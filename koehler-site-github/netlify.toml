[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  # The build needs no runtime dependencies; wrangler is only used for local
  # Cloudflare testing, so skip dev dependencies to keep builds fast.
  NPM_FLAGS = "--omit=dev"

[functions]
  node_bundler = "esbuild"

# Security headers mirror the ones the Cloudflare Worker sets, so behaviour is
# the same whichever host serves the site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
